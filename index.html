<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1c24;
      --bg1: #162a35;
      --bg2: #1d3644;
      --panel: rgba(245, 248, 250, 0.94);
      --panel-border: rgba(22, 42, 53, 0.12);
      --ink: #13232c;
      --muted: #5b6f7a;
      --line: #d5dee4;
      --accent: #1f7a6c;
      --accent-soft: #d7efe9;
      --warn: #b45309;
      --danger: #b42318;
      --day-head: #e8eef2;
      --today: #c7ebe3;
      --shadow: 0 10px 30px rgba(8, 20, 28, 0.18);
      --radius: 14px;
      --font-ui: "IBM Plex Sans", sans-serif;
      --font-display: "Source Serif 4", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #2a5d55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #3a4f6b 0%, transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 45%, var(--bg2));
    }

    body {
      padding: 18px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto minmax(280px, 1fr);
      gap: 14px;
      min-height: calc(100vh - 36px);
    }

    .banner {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      font-size: 0.86rem;
      line-height: 1.45;
      box-shadow: var(--shadow);
    }

    .banner.show { display: block; }
    .banner code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.82em;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .sync-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .sync-pill.live .dot { background: #16a34a; }
    .sync-pill.saving .dot { background: #ca8a04; }
    .sync-pill.error .dot { background: #dc2626; }
    .sync-pill.local .dot { background: #ea580c; }

    .gcal-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .gcal-pill.on {
      border-color: #93c5a5;
      background: #edf8f1;
      color: #1f5c3a;
    }
    .gcal-pill:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfcfd, #f1f5f7);
    }

    .panel-head h1,
    .panel-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel-head h1 { font-size: 1.35rem; }
    .panel-head h2 { font-size: 1.05rem; }

    .panel-sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 11px;
      font: 500 0.82rem var(--font-ui);
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
    }

    button:hover, .btn:hover { filter: brightness(1.05); }
    button:active, .btn:active { transform: translateY(1px); }
    button.ghost {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    button.danger { background: var(--danger); }

    .calendar-body {
      padding: 12px 14px 16px;
      overflow: auto;
    }

    .week-block {
      margin-bottom: 12px;
    }

    .week-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 0 8px;
      font-size: 0.86rem;
      color: var(--muted);
      font-weight: 600;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .day {
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .day.today {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(31, 122, 108, 0.25);
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: var(--day-head);
      border-bottom: 1px solid var(--line);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .day.today .day-head { background: var(--today); }

    .day-date { color: var(--muted); font-weight: 500; }

    .day-events {
      flex: 1;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow: auto;
    }

    .event-chip {
      border: none;
      border-radius: 6px;
      padding: 5px 7px;
      text-align: left;
      background: #d7efe9;
      color: #1f3f3a;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1.25;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-swatch {
      appearance: none;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(19, 35, 44, 0.08);
    }

    .color-swatch:hover { filter: brightness(0.97); }

    .color-swatch.selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px rgba(31, 122, 108, 0.25);
    }

    .event-chip .time {
      display: block;
      font-weight: 500;
      opacity: 0.8;
      font-size: 0.68rem;
    }

    .day-add {
      margin-top: auto;
      border: 1px dashed #b9c7cf;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 0.72rem;
      border-radius: 6px;
    }

    .day-add:hover {
      background: #f3f7f9;
      color: var(--ink);
      filter: none;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      min-height: 0;
    }

    .table-wrap {
      padding: 10px 12px 14px;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }

    table.data {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.84rem;
    }

    table.data th,
    table.data td {
      border: 1px solid var(--line);
      padding: 0;
      vertical-align: top;
    }

    table.data th {
      background: #eef3f6;
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      padding: 8px 10px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    table.data td[contenteditable="true"] {
      padding: 8px 10px;
      outline: none;
      background: #fff;
      min-height: 34px;
      word-break: break-word;
    }

    table.data td[contenteditable="true"]:focus {
      box-shadow: inset 0 0 0 2px rgba(31, 122, 108, 0.35);
      background: #f7fcfb;
    }

    table.data td.actions {
      width: 44px;
      text-align: center;
      vertical-align: middle;
      background: #fafbfc;
    }

    table.data td.actions button {
      padding: 4px 7px;
      background: transparent;
      color: var(--danger);
      border: 1px solid transparent;
    }

    table.data td.actions button:hover {
      border-color: #f0c7c3;
      background: #fff5f4;
      filter: none;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1em;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 24, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .modal h3 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: 1.15rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .field label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: 500 0.9rem var(--font-ui);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 980px) {
      .app { grid-template-rows: auto auto auto; }
      .bottom { grid-template-columns: 1fr; }
      .week-grid { min-width: 720px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="banner" id="setup-banner"></div>

    <section class="panel" id="calendar-panel">
      <div class="panel-head">
        <div>
          <h1>Lab Schedule</h1>
          <p class="panel-sub" id="range-label">Two-week overview</p>
        </div>
        <div class="toolbar">
          <span class="sync-pill local" id="sync-pill"><span class="dot"></span><span id="sync-text">Local only</span></span>
          <button type="button" class="gcal-pill" id="btn-gcal" title="Connect Google Calendar">Google Calendar: Off</button>
          <button type="button" class="ghost" id="btn-prev-week">Prev week</button>
          <button type="button" class="ghost" id="btn-today">This week</button>
          <button type="button" class="ghost" id="btn-next-week">Next week</button>
          <button type="button" id="btn-add-event">Add event</button>
          <span class="status" id="cal-status"></span>
        </div>
      </div>
      <div class="calendar-body" id="calendar-root"></div>
    </section>

    <div class="bottom">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Research Deadlines</h2>
            <p class="panel-sub">Project / task / due date / student</p>
          </div>
          <div class="toolbar">
            <button type="button" class="ghost" data-add-row="research">Add row</button>
            <span class="status" id="research-status"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="research-table">
            <thead>
              <tr>
                <th>Project</th>
                <th>Task</th>
                <th>Due date</th>
                <th>Student</th>
                <th style="width:44px"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Admin / Event Deadlines</h2>
            <p class="panel-sub">Item / task / due date / owner</p>
          </div>
          <div class="toolbar">
            <button type="button" class="ghost" data-add-row="admin">Add row</button>
            <span class="status" id="admin-status"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="admin-table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Task</th>
                <th>Due date</th>
                <th>Owner</th>
                <th style="width:44px"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-backdrop" id="event-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">Event</h3>
      <div class="field">
        <label for="ev-title">Title</label>
        <input id="ev-title" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="ev-date">Date</label>
        <input id="ev-date" type="date" />
      </div>
      <div class="field">
        <label for="ev-time">Start time (optional)</label>
        <input id="ev-time" type="time" />
      </div>
      <div class="field">
        <label for="ev-end-time">End time (optional)</label>
        <input id="ev-end-time" type="time" />
      </div>
      <div class="field">
        <label>Background color</label>
        <input type="hidden" id="ev-color" value="#d7efe9" />
        <div class="color-grid" id="ev-color-grid" role="listbox" aria-label="Event color"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="ev-cancel">Cancel</button>
        <button type="button" class="danger" id="ev-delete" hidden>Delete</button>
        <button type="button" id="ev-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    (function () {
      var LOCAL_KEY = "labmgmt_dashboard_v1";
      var DB_PATH = "labManagement/dashboard";
      var SAVE_DEBOUNCE_MS = 400;
      var DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      var ROW_COUNT = 7;
      var EVENT_COLORS = [
        { bg: "#d7efe9", fg: "#1f3f3a" },
        { bg: "#dceaf7", fg: "#243b53" },
        { bg: "#e8e4f5", fg: "#3a3358" },
        { bg: "#fce8de", fg: "#6a3b28" },
        { bg: "#f7f1d4", fg: "#5c4d1f" },
        { bg: "#f8e1e5", fg: "#6b2f3c" },
        { bg: "#e2efd9", fg: "#35502a" },
        { bg: "#e4e9ee", fg: "#33404a" },
        { bg: "#f6e0d8", fg: "#6a372c" },
        { bg: "#dde4f7", fg: "#2f3b63" }
      ];
      var DEFAULT_COLOR = EVENT_COLORS[0].bg;

      var state = {
        weekOffset: 0,
        events: [],
        research: [],
        admin: [],
        editEventId: null
      };

      var dbRef = null;
      var cloudEnabled = false;
      var applyingRemote = false;
      var saveTimer = null;
      var lastWrittenJson = "";
      var gcalTokenClient = null;
      var gcalAccessToken = "";
      var gcalTokenExpiresAt = 0;
      var gcalReady = false;

      function uid() {
        return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
      }

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function toISODate(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      function parseISODate(s) {
        var p = String(s || "").split("-");
        if (p.length !== 3) return null;
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return isNaN(d.getTime()) ? null : d;
      }

      function startOfWeek(date) {
        var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        var day = d.getDay();
        var diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        return d;
      }

      function addDays(date, n) {
        var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        d.setDate(d.getDate() + n);
        return d;
      }

      function emptyRows(n) {
        var rows = [];
        for (var i = 0; i < n; i++) {
          rows.push({ c0: "", c1: "", c2: "", c3: "" });
        }
        return rows;
      }

      function normalizePayload(data) {
        data = data || {};
        return {
          events: Array.isArray(data.events) ? data.events.map(function (ev) {
            ev = ev || {};
            return {
              id: ev.id != null ? String(ev.id) : uid(),
              title: ev.title != null ? String(ev.title) : "",
              date: ev.date != null ? String(ev.date) : "",
              time: ev.time != null ? String(ev.time) : "",
              endTime: ev.endTime != null ? String(ev.endTime) : "",
              color: ev.color != null ? String(ev.color) : DEFAULT_COLOR,
              gcalEventId: ev.gcalEventId != null ? String(ev.gcalEventId) : ""
            };
          }) : [],
          research: Array.isArray(data.research) && data.research.length
            ? data.research
            : emptyRows(ROW_COUNT),
          admin: Array.isArray(data.admin) && data.admin.length
            ? data.admin
            : emptyRows(ROW_COUNT)
        };
      }

      function payloadFromState() {
        return {
          events: state.events,
          research: state.research,
          admin: state.admin,
          updatedAt: Date.now()
        };
      }

      function setSync(mode, text) {
        var pill = document.getElementById("sync-pill");
        var label = document.getElementById("sync-text");
        pill.className = "sync-pill " + mode;
        label.textContent = text;
      }

      function flashStatus(statusId, text) {
        if (!statusId) return;
        var el = document.getElementById(statusId);
        if (!el) return;
        el.textContent = text || "";
        clearTimeout(el._t);
        if (text) {
          el._t = setTimeout(function () { el.textContent = ""; }, 1200);
        }
      }

      function readLocal() {
        try {
          var raw = localStorage.getItem(LOCAL_KEY);
          if (!raw) return null;
          return normalizePayload(JSON.parse(raw));
        } catch (e) {
          return null;
        }
      }

      function writeLocal(payload) {
        try {
          localStorage.setItem(LOCAL_KEY, JSON.stringify(payload));
        } catch (e) {}
      }

      function hasTableContent(rows) {
        if (!Array.isArray(rows)) return false;
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i] || {};
          if ((r.c0 || r.c1 || r.c2 || r.c3 || "").toString().trim()) return true;
        }
        return false;
      }

      function applyPayload(payload, statusId) {
        var data = normalizePayload(payload);
        state.events = data.events;
        state.research = data.research;
        state.admin = data.admin;
        renderCalendar();
        renderTable("research");
        renderTable("admin");
        writeLocal(data);
        if (statusId) flashStatus(statusId, "Synced");
      }

      function isConfigReady(cfg) {
        if (!cfg || typeof cfg !== "object") return false;
        return !!(cfg.apiKey && cfg.databaseURL && cfg.projectId);
      }

      function showSetupBanner(msg) {
        var el = document.getElementById("setup-banner");
        el.innerHTML = msg;
        el.classList.add("show");
      }

      function queueSave(statusId) {
        if (applyingRemote) return;
        var payload = payloadFromState();
        writeLocal(payload);
        if (!cloudEnabled || !dbRef) {
          flashStatus(statusId, "Saved locally");
          return;
        }
        setSync("saving", "Saving...");
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          var json = JSON.stringify(payload);
          if (json === lastWrittenJson) {
            setSync("live", "Live sync");
            return;
          }
          dbRef.set(payload)
            .then(function () {
              lastWrittenJson = json;
              setSync("live", "Live sync");
              flashStatus(statusId, "Saved");
            })
            .catch(function (err) {
              console.error(err);
              setSync("error", "Save failed");
              flashStatus(statusId, "Save failed");
            });
        }, SAVE_DEBOUNCE_MS);
      }

      function initFirebase() {
        var cfg = window.LAB_FIREBASE_CONFIG;
        if (!isConfigReady(cfg)) {
          setSync("local", "Local only");
          showSetupBanner(
            "Shared sync is not configured yet. Edit <code>firebase-config.js</code> with your Firebase Realtime Database settings, then reopen this page. Until then, data stays in this browser only."
          );
          return false;
        }
        try {
          if (!firebase.apps.length) firebase.initializeApp(cfg);
          dbRef = firebase.database().ref(DB_PATH);
          cloudEnabled = true;
          setSync("saving", "Connecting...");
          dbRef.on("value", function (snap) {
            var remote = snap.val();
            if (!remote) {
              var local = readLocal();
              if (local && ((local.events && local.events.length) || hasTableContent(local.research) || hasTableContent(local.admin))) {
                applyingRemote = true;
                applyPayload(local);
                applyingRemote = false;
                dbRef.set(payloadFromState()).then(function () {
                  lastWrittenJson = JSON.stringify(payloadFromState());
                  setSync("live", "Live sync");
                });
              } else {
                applyingRemote = true;
                applyPayload(normalizePayload(null));
                applyingRemote = false;
                setSync("live", "Live sync");
              }
              return;
            }
            var normalized = normalizePayload(remote);
            var remoteJson = JSON.stringify({
              events: normalized.events,
              research: normalized.research,
              admin: normalized.admin
            });
            var localJson = JSON.stringify({
              events: state.events,
              research: state.research,
              admin: state.admin
            });
            if (remoteJson === localJson) {
              lastWrittenJson = JSON.stringify(payloadFromState());
              setSync("live", "Live sync");
              return;
            }
            applyingRemote = true;
            applyPayload(normalized);
            applyingRemote = false;
            lastWrittenJson = JSON.stringify(payloadFromState());
            setSync("live", "Live sync");
          }, function (err) {
            console.error(err);
            setSync("error", "Sync error");
            showSetupBanner(
              "Could not connect to Firebase. Check Realtime Database rules (read/write allowed) and <code>firebase-config.js</code>."
            );
          });
          return true;
        } catch (e) {
          console.error(e);
          setSync("error", "Config error");
          showSetupBanner("Firebase init failed. Check <code>firebase-config.js</code>.");
          return false;
        }
      }

      function gcalConfig() {
        var c = window.LAB_GOOGLE_CALENDAR || {};
        return {
          clientId: String(c.clientId || "").trim(),
          apiKey: String(c.apiKey || (window.LAB_FIREBASE_CONFIG && window.LAB_FIREBASE_CONFIG.apiKey) || "").trim(),
          timeZone: String(c.timeZone || "Asia/Seoul").trim() || "Asia/Seoul"
        };
      }

      function gcalConfigured() {
        return !!gcalConfig().clientId;
      }

      function gcalConnected() {
        return !!(gcalAccessToken && Date.now() < gcalTokenExpiresAt - 15000);
      }

      function updateGcalButton() {
        var btn = document.getElementById("btn-gcal");
        if (!btn) return;
        if (!gcalConfigured()) {
          btn.disabled = true;
          btn.classList.remove("on");
          btn.textContent = "Google Calendar: Setup needed";
          btn.title = "Add LAB_GOOGLE_CALENDAR.clientId in firebase-config.js";
          return;
        }
        btn.disabled = false;
        if (gcalConnected()) {
          btn.classList.add("on");
          btn.textContent = "Google Calendar: On";
          btn.title = "Click to disconnect this browser session";
        } else {
          btn.classList.remove("on");
          btn.textContent = "Google Calendar: Off";
          btn.title = "Connect to sync new/edited events to your Google Calendar";
        }
      }

      function initGcal() {
        updateGcalButton();
        if (!gcalConfigured()) return;
        if (!(window.google && google.accounts && google.accounts.oauth2)) {
          setTimeout(initGcal, 250);
          return;
        }
        if (gcalTokenClient) {
          gcalReady = true;
          updateGcalButton();
          return;
        }
        gcalTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: gcalConfig().clientId,
          scope: "https://www.googleapis.com/auth/calendar.events",
          callback: function (resp) {
            if (resp && resp.error) {
              console.error(resp);
              flashStatus("cal-status", "Google auth failed");
              updateGcalButton();
              return;
            }
            gcalAccessToken = resp.access_token || "";
            var expiresIn = Number(resp.expires_in || 3600);
            gcalTokenExpiresAt = Date.now() + expiresIn * 1000;
            flashStatus("cal-status", "Google Calendar connected");
            updateGcalButton();
          }
        });
        gcalReady = true;
        updateGcalButton();
      }

      function requestGcalToken(promptValue) {
        return new Promise(function (resolve, reject) {
          if (!gcalConfigured()) {
            reject(new Error("Google Calendar clientId is not configured"));
            return;
          }
          if (!gcalTokenClient) {
            reject(new Error("Google Identity script is not ready"));
            return;
          }
          var prev = gcalTokenClient.callback;
          gcalTokenClient.callback = function (resp) {
            gcalTokenClient.callback = prev;
            if (resp && resp.error) {
              reject(new Error(resp.error));
              updateGcalButton();
              return;
            }
            gcalAccessToken = resp.access_token || "";
            var expiresIn = Number(resp.expires_in || 3600);
            gcalTokenExpiresAt = Date.now() + expiresIn * 1000;
            updateGcalButton();
            resolve(gcalAccessToken);
          };
          gcalTokenClient.requestAccessToken({ prompt: promptValue || "" });
        });
      }

      function ensureGcalToken() {
        if (gcalConnected()) return Promise.resolve(gcalAccessToken);
        return requestGcalToken("");
      }

      function buildGcalBody(ev) {
        var cfg = gcalConfig();
        var body = {
          summary: ev.title || "(no title)",
          description: "Synced from Lab Management dashboard"
        };
        if (ev.time) {
          var start = String(ev.date) + "T" + String(ev.time) + ":00";
          var endT = ev.endTime || "";
          if (!endT) {
            var parts = String(ev.time).split(":");
            var h = Number(parts[0] || 0) + 1;
            var m = Number(parts[1] || 0);
            if (h > 23) { h = 23; m = 59; }
            endT = pad(h) + ":" + pad(m);
          }
          body.start = { dateTime: start, timeZone: cfg.timeZone };
          body.end = { dateTime: String(ev.date) + "T" + endT + ":00", timeZone: cfg.timeZone };
        } else {
          var d0 = parseISODate(ev.date);
          var d1 = d0 ? addDays(d0, 1) : null;
          body.start = { date: ev.date };
          body.end = { date: d1 ? toISODate(d1) : ev.date };
        }
        return body;
      }

      function gcalFetch(path, method, bodyObj) {
        return ensureGcalToken().then(function (token) {
          return fetch("https://www.googleapis.com/calendar/v3/" + path, {
            method: method,
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json"
            },
            body: bodyObj ? JSON.stringify(bodyObj) : undefined
          }).then(function (res) {
            if (res.status === 401) {
              gcalAccessToken = "";
              gcalTokenExpiresAt = 0;
              updateGcalButton();
              return ensureGcalToken().then(function (token2) {
                return fetch("https://www.googleapis.com/calendar/v3/" + path, {
                  method: method,
                  headers: {
                    Authorization: "Bearer " + token2,
                    "Content-Type": "application/json"
                  },
                  body: bodyObj ? JSON.stringify(bodyObj) : undefined
                });
              });
            }
            return res;
          });
        }).then(function (res) {
          if (!res.ok) {
            return res.text().then(function (txt) {
              throw new Error("Google Calendar API " + res.status + ": " + txt);
            });
          }
          if (res.status === 204) return null;
          return res.json();
        });
      }

      function syncEventToGoogle(ev) {
        if (!gcalConfigured() || !gcalConnected()) return Promise.resolve(null);
        if (!ev) return Promise.resolve(null);
        var body = buildGcalBody(ev);
        var req;
        if (ev.gcalEventId) {
          req = gcalFetch("calendars/primary/events/" + encodeURIComponent(ev.gcalEventId), "PATCH", body);
        } else {
          req = gcalFetch("calendars/primary/events", "POST", body);
        }
        return req.then(function (data) {
          if (data && data.id) {
            ev.gcalEventId = data.id;
            queueSave("cal-status");
          }
          return data;
        }).catch(function (err) {
          console.error(err);
          flashStatus("cal-status", "Google sync failed");
          return null;
        });
      }

      function deleteEventFromGoogle(ev) {
        if (!gcalConfigured() || !gcalConnected()) return Promise.resolve(null);
        if (!ev || !ev.gcalEventId) return Promise.resolve(null);
        return gcalFetch(
          "calendars/primary/events/" + encodeURIComponent(ev.gcalEventId),
          "DELETE",
          null
        ).catch(function (err) {
          console.error(err);
          flashStatus("cal-status", "Google delete failed");
          return null;
        });
      }

      function eventsOn(iso) {
        return state.events
          .filter(function (ev) { return ev.date === iso; })
          .sort(function (a, b) {
            return String(a.time || "").localeCompare(String(b.time || ""));
          });
      }

      function formatTimeRange(start, end) {
        start = start || "";
        end = end || "";
        if (start && end) return start + " - " + end;
        if (start) return start;
        if (end) return "~ " + end;
        return "";
      }

      function colorMeta(bg) {
        for (var i = 0; i < EVENT_COLORS.length; i++) {
          if (EVENT_COLORS[i].bg === bg) return EVENT_COLORS[i];
        }
        return EVENT_COLORS[0];
      }

      function renderColorGrid(selected) {
        var grid = document.getElementById("ev-color-grid");
        var html = "";
        for (var i = 0; i < EVENT_COLORS.length; i++) {
          var c = EVENT_COLORS[i];
          var sel = c.bg === selected ? " selected" : "";
          html += '<button type="button" class="color-swatch' + sel + '" data-color="' + c.bg + '" style="background:' + c.bg + '" title="Color ' + (i + 1) + '" aria-label="Color ' + (i + 1) + '"></button>';
        }
        grid.innerHTML = html;
        document.getElementById("ev-color").value = selected || DEFAULT_COLOR;
      }

      function renderCalendar() {
        var root = document.getElementById("calendar-root");
        var base = addDays(startOfWeek(new Date()), state.weekOffset * 7);
        var todayIso = toISODate(new Date());
        var end = addDays(base, 13);
        document.getElementById("range-label").textContent =
          "Showing " + toISODate(base) + " to " + toISODate(end);

        var html = "";
        for (var w = 0; w < 2; w++) {
          var weekStart = addDays(base, w * 7);
          var weekEnd = addDays(weekStart, 6);
          html += '<div class="week-block">';
          html += '<div class="week-label"><span>Week ' + (w + 1) + '</span>';
          html += "<span>" + toISODate(weekStart) + " - " + toISODate(weekEnd) + "</span></div>";
          html += '<div class="week-grid">';
          for (var i = 0; i < 7; i++) {
            var day = addDays(weekStart, i);
            var iso = toISODate(day);
            var isToday = iso === todayIso;
            html += '<div class="day' + (isToday ? " today" : "") + '" data-date="' + iso + '">';
            html += '<div class="day-head"><span>' + DAY_NAMES[i] + '</span>';
            html += '<span class="day-date">' + pad(day.getMonth() + 1) + "/" + pad(day.getDate()) + "</span></div>";
            html += '<div class="day-events">';
            var list = eventsOn(iso);
            for (var e = 0; e < list.length; e++) {
              var ev = list[e];
              var cm = colorMeta(ev.color || DEFAULT_COLOR);
              html += '<button type="button" class="event-chip" data-edit-id="' + ev.id + '" style="background:' + cm.bg + ';color:' + cm.fg + '">';
              var timeLabel = formatTimeRange(ev.time, ev.endTime);
              if (timeLabel) html += '<span class="time">' + timeLabel + "</span>";
              html += escapeHtml(ev.title || "(untitled)") + "</button>";
            }
            html += '<button type="button" class="day-add" data-add-date="' + iso + '">+ Add</button>';
            html += "</div></div>";
          }
          html += "</div></div>";
        }
        root.innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function readTable(kind) {
        var table = document.getElementById(kind + "-table");
        var rows = [];
        var trs = table.tBodies[0].rows;
        for (var i = 0; i < trs.length; i++) {
          var cells = trs[i].querySelectorAll('[contenteditable="true"]');
          rows.push({
            c0: (cells[0] && cells[0].textContent || "").trim(),
            c1: (cells[1] && cells[1].textContent || "").trim(),
            c2: (cells[2] && cells[2].textContent || "").trim(),
            c3: (cells[3] && cells[3].textContent || "").trim()
          });
        }
        return rows;
      }

      function renderTable(kind) {
        var table = document.getElementById(kind + "-table");
        var rows = state[kind];
        var html = "";
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          html += "<tr>";
          html += '<td contenteditable="true" data-col="0">' + escapeHtml(r.c0) + "</td>";
          html += '<td contenteditable="true" data-col="1">' + escapeHtml(r.c1) + "</td>";
          html += '<td contenteditable="true" data-col="2">' + escapeHtml(r.c2) + "</td>";
          html += '<td contenteditable="true" data-col="3">' + escapeHtml(r.c3) + "</td>";
          html += '<td class="actions"><button type="button" data-del-row="' + kind + '" data-idx="' + i + '" title="Remove row">x</button></td>';
          html += "</tr>";
        }
        table.tBodies[0].innerHTML = html;
      }

      function persistTable(kind) {
        state[kind] = readTable(kind);
        queueSave(kind + "-status");
      }

      function openModal(opts) {
        state.editEventId = opts.id || null;
        document.getElementById("modal-title").textContent = opts.id ? "Edit event" : "Add event";
        document.getElementById("ev-title").value = opts.title || "";
        document.getElementById("ev-date").value = opts.date || toISODate(new Date());
        document.getElementById("ev-time").value = opts.time || "";
        document.getElementById("ev-end-time").value = opts.endTime || "";
        renderColorGrid(opts.color || DEFAULT_COLOR);
        document.getElementById("ev-delete").hidden = !opts.id;
        var modal = document.getElementById("event-modal");
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        document.getElementById("ev-title").focus();
      }

      function closeModal() {
        var modal = document.getElementById("event-modal");
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        state.editEventId = null;
      }

      function bindEvents() {
        document.getElementById("btn-prev-week").addEventListener("click", function () {
          state.weekOffset -= 1;
          renderCalendar();
        });
        document.getElementById("btn-next-week").addEventListener("click", function () {
          state.weekOffset += 1;
          renderCalendar();
        });
        document.getElementById("btn-today").addEventListener("click", function () {
          state.weekOffset = 0;
          renderCalendar();
        });
        document.getElementById("btn-add-event").addEventListener("click", function () {
          openModal({ date: toISODate(new Date()) });
        });
        document.getElementById("btn-gcal").addEventListener("click", function () {
          if (!gcalConfigured()) return;
          if (gcalConnected()) {
            var oldToken = gcalAccessToken;
            gcalAccessToken = "";
            gcalTokenExpiresAt = 0;
            try {
              if (window.google && google.accounts && google.accounts.oauth2 && oldToken) {
                google.accounts.oauth2.revoke(oldToken);
              }
            } catch (err) {}
            flashStatus("cal-status", "Google Calendar disconnected");
            updateGcalButton();
            return;
          }
          requestGcalToken("consent").then(function () {
            flashStatus("cal-status", "Google Calendar connected");
          }).catch(function (err) {
            console.error(err);
            flashStatus("cal-status", "Google connect failed");
          });
        });

        document.getElementById("calendar-root").addEventListener("click", function (e) {
          var editBtn = e.target.closest("[data-edit-id]");
          if (editBtn) {
            var id = editBtn.getAttribute("data-edit-id");
            var ev = state.events.find(function (x) { return x.id === id; });
            if (ev) openModal(ev);
            return;
          }
          var addBtn = e.target.closest("[data-add-date]");
          if (addBtn) {
            openModal({ date: addBtn.getAttribute("data-add-date") });
          }
        });

        document.getElementById("ev-cancel").addEventListener("click", closeModal);
        document.getElementById("ev-color-grid").addEventListener("click", function (e) {
          var btn = e.target.closest("[data-color]");
          if (!btn) return;
          renderColorGrid(btn.getAttribute("data-color"));
        });
        document.getElementById("event-modal").addEventListener("click", function (e) {
          if (e.target === e.currentTarget) closeModal();
        });

        document.getElementById("ev-save").addEventListener("click", function () {
          var title = document.getElementById("ev-title").value.trim();
          var date = document.getElementById("ev-date").value;
          var time = document.getElementById("ev-time").value;
          var endTime = document.getElementById("ev-end-time").value;
          var color = document.getElementById("ev-color").value || DEFAULT_COLOR;
          if (time && endTime && endTime < time) {
            document.getElementById("ev-end-time").focus();
            return;
          }
          if (!title) {
            document.getElementById("ev-title").focus();
            return;
          }
          if (!parseISODate(date)) {
            document.getElementById("ev-date").focus();
            return;
          }
          var savedEv = null;
          if (state.editEventId) {
            var found = state.events.find(function (x) { return x.id === state.editEventId; });
            if (found) {
              found.title = title;
              found.date = date;
              found.time = time;
              found.endTime = endTime;
              found.color = color;
              savedEv = found;
            }
          } else {
            savedEv = { id: uid(), title: title, date: date, time: time, endTime: endTime, color: color, gcalEventId: "" };
            state.events.push(savedEv);
          }
          queueSave("cal-status");
          closeModal();
          renderCalendar();
          if (gcalConnected()) {
            syncEventToGoogle(savedEv).then(function () {
              renderCalendar();
            });
          }
        });

        document.getElementById("ev-delete").addEventListener("click", function () {
          if (!state.editEventId) return;
          var removing = state.events.find(function (x) { return x.id === state.editEventId; });
          state.events = state.events.filter(function (x) { return x.id !== state.editEventId; });
          queueSave("cal-status");
          closeModal();
          renderCalendar();
          if (removing) deleteEventFromGoogle(removing);
        });

        document.querySelectorAll("[data-add-row]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var kind = btn.getAttribute("data-add-row");
            persistTable(kind);
            state[kind].push({ c0: "", c1: "", c2: "", c3: "" });
            renderTable(kind);
            queueSave(kind + "-status");
          });
        });

        ["research", "admin"].forEach(function (kind) {
          var table = document.getElementById(kind + "-table");
          table.addEventListener("input", function () {
            persistTable(kind);
          });
          table.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-del-row]");
            if (!btn) return;
            var idx = Number(btn.getAttribute("data-idx"));
            persistTable(kind);
            if (state[kind].length <= 1) {
              state[kind][0] = { c0: "", c1: "", c2: "", c3: "" };
            } else {
              state[kind].splice(idx, 1);
            }
            renderTable(kind);
            queueSave(kind + "-status");
          });
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeModal();
        });
      }

      var local = readLocal();
      applyPayload(local || normalizePayload(null));
      bindEvents();
      initFirebase();
      initGcal();
    })();
  </script>
</body>
</html>
